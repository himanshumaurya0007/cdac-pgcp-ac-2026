<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
</head>

<body>
    <!-- Program 1 -->
    <h2 class="item">Item 1</h2>
    <h2 class="item">Item 2</h2>
    <h2 class="item">Item 3</h2>

    <button id="btn">Get Second Element</button>
    <br>
    <br>
    <br>

    <!-- Program 2 -->
    <a id="myLink" href="https://www.google.com">Go to Google</a>
    <br><br>

    <button id="changeBtn">Change Link</button>

    <!-- Program 4 -->

    <script>
        $(document).ready(function () {
            // <!-- Program 1 -->
            $("#btn").click(function () {
                // Select the second element (index starts from 0)
                var element = $(".item").eq(1);

                // Change its CSS to highlight it
                element.css("color", "red");

                // Display its text
                alert("Selected Element: " + element.text());
            });

            // <!-- Program 2 -->
            $("#changeBtn").click(function () {

                // Change the hyperlink URL
                $("#myLink").attr("href", "https://www.wikipedia.org");

                // Change the text of the link
                $("#myLink").text("Go to Wikipedia");
            });

            // <!-- Program 3 --> // Uncomment and click/tap the elements of the browser to see the effect.
            // $("*").click(function () {
            //     alert("Single Click detected on: " + this.tagName);
            // });

            // $("*").dblclick(function () {
            //     alert("Double Click detected on: " + this.tagName);
            // });

            // <!-- Program 4 -->
            // Hide all headings when clicked
            $(":header").click(function () {
                $(this).hide();
            });

            // Find mouse pointer position relative to the document
            $(document).mousemove(function (event) {
                var x = event.pageX; // distance from left edge
                var y = event.pageY; // distance from top edge

                console.log("Mouse Position - X: " + x + " Y: " + y);
            });
        });
    </script>
</body>

</html>
